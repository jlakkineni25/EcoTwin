# Hourly live forecast. Downloads fresh OpenAQ + Open-Meteo data, runs the 5 final models, and force-pushes the 5 small
# live JSON files to the branch "live-data" (no history, so main stays clean). The website reads them from there.
# Needs the repository secret OPENAQ_API_KEY (Settings > Secrets and variables > Actions).
name: live-refresh

on:
  schedule:
    - cron: '17 * * * *'      # every hour at :17 (GitHub may start it a few minutes late)
  workflow_dispatch:           # run it by hand from the Actions tab

permissions:
  contents: write              # to push the live-data branch

concurrency:
  group: live-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: v2_clean/requirements-live.txt

      - name: Install packages
        run: |
          python -m pip install --upgrade pip
          pip install torch==2.11.0 --index-url https://download.pytorch.org/whl/cpu
          pip install -r v2_clean/requirements-live.txt

      - name: Run the live forecast
        working-directory: v2_clean
        env:
          OPENAQ_API_KEY: ${{ secrets.OPENAQ_API_KEY }}
        run: python live_refresh.py --out-dir "$RUNNER_TEMP/live_out" --cache-dir "$RUNNER_TEMP/live_cache"

      - name: Check the output before publishing
        run: |
          cd "$RUNNER_TEMP/live_out"
          for f in live_frame.json live_meta.json live_whatif.json live_wind_now.json live_wind_edges.json; do
            test -s "$f" || { echo "missing or empty: $f"; exit 1; }
            python -c "import json,sys; json.load(open('$f'))"
          done
          python - <<'PY'
          import json
          m = json.load(open('live_meta.json'))
          print('now_hour', m['now_hour'], '| age_hours', m['age_hours'], '| stations observed', m['stations_observed_now'])
          assert m['stations_observed_now'] >= 10, 'too few stations reporting: not publishing'
          PY

      - name: Publish to the live-data branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd "$RUNNER_TEMP/live_out"
          mkdir "$RUNNER_TEMP/publish"
          cp live_frame.json live_meta.json live_whatif.json live_wind_now.json live_wind_edges.json "$RUNNER_TEMP/publish/"
          cd "$RUNNER_TEMP/publish"
          git init -q -b live-data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -q -m "live data $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" live-data
