# Builds the website (frontend/) and publishes it on GitHub Pages: https://<user>.github.io/<repo>/
# Runs when the frontend changes on main, or by hand. The live data is NOT part of this build: the page reads it from the
# live-data branch (written every hour by live-refresh.yml), so the site does not need a new deploy for fresh data.
# One-time setup: Settings > Pages > Source = "GitHub Actions".
name: deploy-pages

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install and build
        working-directory: frontend
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
          VITE_LIVE_BASE: https://raw.githubusercontent.com/${{ github.repository }}/live-data
        run: |
          npm ci
          npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
